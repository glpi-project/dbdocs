name: Publish GLPI Database Documentation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  publish-dbdocs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dbdocs repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dbdocs CLI
        run: sudo npm install -g dbdocs

      - name: Verify dbdocs installation
        run: dbdocs --version

      - name: Clone GLPI repository
        run: |
          git clone https://github.com/glpi-project/glpi.git /tmp/glpi
          cd /tmp/glpi
          echo "GLPI repository cloned"

      - name: Checkout GLPI 10.0/bugfixes
        run: |
          cd /tmp/glpi
          git checkout 10.0/bugfixes
          echo "Checked out 10.0/bugfixes branch"

      - name: Generate GLPI 10 schema
        run: |
          python glpi_dbdocs.py generate \
            --sql-file /tmp/glpi/install/mysql/glpi-empty.sql \
            --relation-file /tmp/glpi/inc/relation.constant.php \
            --output docs \
            --output-file glpi-10.dbml

      - name: Checkout GLPI 11.0/bugfixes
        run: |
          cd /tmp/glpi
          git checkout 11.0/bugfixes
          echo "Checked out 11.0/bugfixes branch"

      - name: Generate GLPI 11 schema
        run: |
          python glpi_dbdocs.py generate \
            --sql-file /tmp/glpi/install/mysql/glpi-empty.sql \
            --relation-file /tmp/glpi/inc/relation.constant.php \
            --output docs \
            --output-file glpi-11.dbml

      - name: Checkout GLPI 12.0/bugfixes
        run: |
          cd /tmp/glpi
          git checkout 12.0/bugfixes
          echo "Checked out 12.0/bugfixes branch"

      - name: Generate GLPI 12 schema
        run: |
          python glpi_dbdocs.py generate \
            --sql-file /tmp/glpi/install/mysql/glpi-empty.sql \
            --relation-file /tmp/glpi/inc/relation.constant.php \
            --output docs \
            --output-file glpi-12.dbml

      - name: Checkout GLPI main
        run: |
          cd /tmp/glpi
          git checkout main
          echo "Checked out main branch"

      - name: Generate GLPI Main schema
        run: |
          python glpi_dbdocs.py generate \
            --sql-file /tmp/glpi/install/mysql/glpi-empty.sql \
            --relation-file /tmp/glpi/inc/relation.constant.php \
            --output docs \
            --output-file glpi-main.dbml

      - name: Publish schemas to dbdocs
        if: github.event_name != 'pull_request'
        env:
          DBDOCS_TOKEN: ${{ secrets.DBDOCS_TOKEN }}
        run: |
          # Retry transient dbdocs API errors (e.g. HTTP 500)
          build() {
            for attempt in 1 2 3 4 5; do
              dbdocs build "$1" --project "$2" --public && return 0
              echo "::warning::dbdocs build $1 for '$2' failed (attempt $attempt/5)"
              sleep $((attempt * 15))
            done
            return 1
          }

          # Each project is removed right before being rebuilt, so a failure
          # on one project does not leave the others removed
          publish() {
            project="$1"; shift
            dbdocs remove "$project" || true
            for file in "$@"; do
              build "$file" "$project" || return 1
            done
            echo "Published $project"
          }

          failed=()
          publish "GLPI 12" docs/glpi-12.dbml || failed+=("GLPI 12")
          publish "GLPI 11" docs/glpi-11.dbml || failed+=("GLPI 11")
          publish "GLPI 10" docs/glpi-10.dbml || failed+=("GLPI 10")
          publish "GLPI Main" docs/glpi-main.dbml || failed+=("GLPI Main")
          publish "GLPI 11 to 12" docs/glpi-11.dbml docs/glpi-12.dbml || failed+=("GLPI 11 to 12")
          publish "GLPI 10 to 11" docs/glpi-10.dbml docs/glpi-11.dbml || failed+=("GLPI 10 to 11")

          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Failed to publish: %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Upload generated DBML files as artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: glpi-dbml-schemas
          path: docs/*.dbml
          retention-days: 30

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Publication Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following GLPI database schemas have been published to dbdocs.io:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **GLPI 10** (from 10.0/bugfixes branch)" >> $GITHUB_STEP_SUMMARY
          echo "- **GLPI 11** (from 11.0/bugfixes branch)" >> $GITHUB_STEP_SUMMARY
          echo "- **GLPI 12** (from 12.0/bugfixes branch)" >> $GITHUB_STEP_SUMMARY
          echo "- **GLPI Main** (from main branch)" >> $GITHUB_STEP_SUMMARY
          echo "- **GLPI 10 to 11** (comparison view)" >> $GITHUB_STEP_SUMMARY
          echo "- **GLPI 11 to 12** (comparison view)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated DBML files are available as build artifacts." >> $GITHUB_STEP_SUMMARY
